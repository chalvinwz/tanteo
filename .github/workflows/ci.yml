name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The engine needs no clock and no network; everything here is deterministic.
  CI: true

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first, and not for speed. @tanteo/engine and @tanteo/share are
      # consumed through their built dist, so on a clean checkout the server and
      # web typechecks cannot resolve them until those packages have been built.
      # pnpm -r builds in topological order, so this is the step that makes the
      # two after it possible.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The built client is what e2e and Lighthouse measure, so it is built once
      # here and handed on rather than rebuilt per job.
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/web/dist
            apps/server/dist
            packages/*/dist
          retention-days: 1

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: pnpm --filter @tanteo/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @tanteo/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: pnpm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7

  image:
    name: docker buildx (amd64 and arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          # Nothing in the tree is a native addon, so the arm64 leg is a set of
          # file copies rather than a compile under emulation. That is the whole
          # reason storage is node:sqlite; see docs/decisions.md.
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
